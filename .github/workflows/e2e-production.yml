name: E2E Tests — Production

# Runs E2E tests against https://lennypeters.com on demand.
# Trigger manually from the Actions tab to verify the live site after a deploy
# or when debugging production-only issues.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to test (default: https://lennypeters.com)'
        required: false
        default: 'https://lennypeters.com'

jobs:
  e2e-production:
    name: E2E Tests — Production Domain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against production
        run: npm run test:e2e
        env:
          CI: true
          E2E_TEST_URL: ${{ inputs.url || 'https://lennypeters.com' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7

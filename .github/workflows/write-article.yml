name: Write Article from Issue
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  write-article:
    if: |
      (github.event.action == 'opened' &&
        (startsWith(github.event.issue.title, '[Article]') ||
          contains(github.event.issue.labels.*.name, 'article'))) ||
      (github.event.action == 'labeled' && github.event.label.name == 'article')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive article request context
        id: article
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { buildArticleRequestContext } = require('./src/lib/article-request.js')

          const context = buildArticleRequestContext({
            issueTitle: process.env.ISSUE_TITLE,
            issueBody: process.env.ISSUE_BODY,
          })
          const multilineOutput = (name, value) => {
            const delimiter = `COPILOT_${name}_${Date.now()}_${Math.random().toString(36).slice(2)}`
            return `${name}<<${delimiter}\n${value}\n${delimiter}`
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              multilineOutput('slug', context.slug),
              multilineOutput('branch', context.branch),
              multilineOutput('topic', context.topic),
              multilineOutput('commit_title', context.commitTitle),
              multilineOutput('pr_title', context.prTitle),
              '',
            ].join('\n')
          )
          NODE

      - name: Create article branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.article.outputs.branch }}"

      - name: Write article via Copilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTICLE_TOPIC: ${{ steps.article.outputs.topic }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          MESSAGES="$(node <<'NODE'
          const messages = [
            {
              role: 'user',
              content: `Write a technical article about: ${process.env.ARTICLE_TOPIC ?? ''}

          Additional context from the issue:
          ${process.env.ISSUE_BODY ?? ''}`,
            },
          ]

          process.stdout.write(JSON.stringify(messages))
          NODE
          )"

          npx -y @github/gh-copilot -- api /models/copilot_chat/completions \
            -f "messages=$MESSAGES" \
            -f model=gpt-4o \
            > article_output.json

      - name: Check for new article
        id: check
        run: |
          if git diff --name-only | grep -q "^content/articles/"; then
            echo "has_article=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_article=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.has_article == 'true'
        run: |
          git add content/articles/
          git commit -m "${{ steps.article.outputs.commit_title }}"
          git push origin "${{ steps.article.outputs.branch }}"

      - name: Create Pull Request
        if: steps.check.outputs.has_article == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: ${{ steps.article.outputs.branch }}
          title: '${{ steps.article.outputs.pr_title }}'
          body: |
            ## Auto-generated Article

            This article was generated by the `write-article` agent from issue #${{ github.event.issue.number }}.

            Closes #${{ github.event.issue.number }}
          assignees: ${{ github.event.issue.user.login }}

      - name: Comment on issue
        if: steps.check.outputs.has_article == 'true'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            The `write-article` agent has drafted an article for this topic. A pull request has been created on branch `${{ steps.article.outputs.branch }}` for your review.
